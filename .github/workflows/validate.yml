name: Validate code supplement

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  code-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate source package
        run: python scripts/validate_submission.py
      - name: Check shell entry points
        run: bash -n researcher.sh scripts/bootstrap.sh scripts/run_researcher.sh scripts/smoke_paper_cases.sh
      - name: Prepare paper case smoke inputs
        run: PYTHON_BIN=python scripts/smoke_paper_cases.sh

  researcher-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Researcher dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run offline Researcher preflight
        run: PYTHON_BIN=python ./researcher.sh --check
      - name: Test the OpenAI-compatible API path
        run: python scripts/test_openai_compat.py
